<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดูสต๊อกสินค้า (Inventory)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md mt-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-gray-800">📦 รายการสต๊อกสินค้า</h1>
      <button onclick="window.location.href='index.html'" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 font-bold">
        กลับหน้าหลัก
      </button>
    </div>
    
    <!-- ช่องค้นหา -->
    <div class="mb-4">
      <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 ค้นหา บาร์โค้ด หรือ ชื่อสินค้า..." class="w-full px-4 py-2 border rounded-lg focus:ring-amber-500">
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border">
        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="py-2 px-4 border text-left">บาร์โค้ด</th>
            <th class="py-2 px-4 border text-left">ชื่อสินค้า</th>
            <th class="py-2 px-4 border text-center">หมวดหมู่</th>
            <th class="py-2 px-4 border text-right">คงเหลือ</th>
            <th class="py-2 px-4 border text-center">จุดจัดเก็บ</th>
            <th class="py-2 px-4 border text-center">สถานะ</th>
          </tr>
        </thead>
        <tbody id="table-body" class="text-gray-700">
          <tr>
            <td colspan="6" class="py-8 text-center text-gray-500">กำลังโหลดข้อมูล...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ นำ URL Web App ของคุณมาใส่ตรงนี้
    const API_URL = "ใส่_URL_WEB_APP_ของคุณตรงนี้"; 
    
    let inventoryData = [];

    // เมื่อเปิดหน้าเว็บ ให้ดึงข้อมูลทันที
    window.onload = async function() {
      await loadInventory();
    };

    async function loadInventory() {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'get_inventory' })
        });
        const result = await response.json();
        
        if(result.success) {
          inventoryData = result.data; // เก็บข้อมูลไว้ในตัวแปร
          renderTable(inventoryData);  // ส่งไปวาดตาราง
        } else {
          document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="py-4 text-center text-red-500">ดึงข้อมูลไม่สำเร็จ</td></tr>`;
        }
      } catch (error) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="py-4 text-center text-red-500">เชื่อมต่อระบบไม่ได้</td></tr>`;
      }
    }

    // ฟังก์ชันวาดตาราง
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center">ไม่มีข้อมูลในสต๊อก</td></tr>`;
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";
        
        // กำหนดสีป้ายสถานะ
        let statusBadge = item.status === 'Active' 
          ? '<span class="bg-green-500 text-white px-2 py-1 rounded text-xs">Active</span>' 
          : `<span class="bg-gray-400 text-white px-2 py-1 rounded text-xs">${item.status}</span>`;

        tr.innerHTML = `
          <td class="py-2 px-4 border font-bold text-blue-600">${item.barcode_id}</td>
          <td class="py-2 px-4 border">${item.item_name}</td>
          <td class="py-2 px-4 border text-center">${item.category}</td>
          <td class="py-2 px-4 border text-right font-bold text-green-700">${item.weight_current} ${item.unit}</td>
          <td class="py-2 px-4 border text-center">${item.location}</td>
          <td class="py-2 px-4 border text-center">${statusBadge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ฟังก์ชันค้นหาข้อมูล (พิมพ์ปุ๊บ กรองปั๊บ)
    function filterTable() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const filteredData = inventoryData.filter(item => 
        item.barcode_id.toLowerCase().includes(searchText) || 
        item.item_name.toLowerCase().includes(searchText)
      );
      renderTable(filteredData);
    }
  </script>
</body>
</html>
