<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - เบิกคั่ว (WIP)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased selection:bg-gray-200">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar Desktop -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-8 pb-6 px-4 z-40 shadow-sm">
      <h2 class="text-xl font-black text-black mb-8 px-2 tracking-tight">BJ ROASTER</h2>
      <nav class="flex-1 space-y-1">
        <a href="index.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">หน้าแรก</a>
        <a href="planner.html" class="flex items-center gap-3 bg-black text-white px-3.5 py-2.5 rounded-lg font-bold text-sm transition">ทำงาน</a>
        <a href="report.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">รายงาน</a>
        <a href="stock.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">สต๊อกสินค้า</a>
        <a href="profile.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">โปรไฟล์</a>
      </nav>
      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-400 hover:text-black px-3.5 py-2.5 rounded-lg font-bold text-sm transition">ออกจากระบบ</button>
    </aside>

    <main class="w-full md:ml-64 relative flex flex-col min-h-screen">
      
      <!-- 🌟 แถบเมนูด้านบน สไตล์ Binance Tab Header (ข้อความล้วน ขาว-ดำ) 🌟 -->
      <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200">
        <div class="flex items-center gap-2 overflow-x-auto px-4 md:px-8 py-2.5 snap-x">
          <button onclick="window.location.href='planner.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">วางแผน</button>
          <!-- Active Tab: เบิกคั่ว -->
          <button class="px-4 py-2 rounded-lg text-sm font-bold bg-black text-white whitespace-nowrap shadow-sm">เบิกคั่ว</button>
          <button onclick="window.location.href='packing.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">บรรจุสินค้า</button>
          <button onclick="window.location.href='shipping.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">จัดส่ง</button>
          <button onclick="window.location.href='item_master.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">เพิ่มข้อมูลใหม่</button>
          <button onclick="window.location.href='inbound.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">รับสินค้าเข้า</button>
        </div>
      </div>

      <!-- ฟอร์มเบิกคั่วหน้าเตา -->
      <div class="p-4 md:p-8 pb-28 max-w-2xl space-y-6">
        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
          <div class="border-b border-gray-100 pb-3">
            <h2 class="text-base font-bold text-black">เบิกสารกาแฟเข้าเตาคั่ว</h2>
            <p class="text-xs text-gray-400">สแกนรหัสเพื่อตัดสต๊อกสารกาแฟ</p>
          </div>
          
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">รหัสบาร์โค้ด / พาเลท</label>
              <div class="flex gap-2">
                <input type="text" id="barcode" class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg font-mono font-bold text-black uppercase text-sm" placeholder="สแกนหรือพิมพ์รหัส...">
                <button type="button" onclick="fetchData()" class="bg-black text-white font-bold px-4 rounded-lg text-xs hover:bg-gray-800 transition">ค้นหา</button>
              </div>
            </div>

            <div id="item-info" class="hidden p-3 bg-gray-50 rounded-lg border border-gray-200 space-y-1">
              <span class="text-xs font-bold text-gray-400">รายละเอียด</span>
              <h3 id="show-name" class="font-bold text-sm text-black">-</h3>
              <p class="text-xs text-gray-600">สต๊อกคงเหลือ: <span id="show-stock" class="font-bold text-black">0</span> kg</p>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">น้ำหนักที่เบิก (kg)</label>
              <input type="number" id="issue-qty" step="0.01" class="w-full px-3 py-2 border border-black rounded-lg text-lg font-black" placeholder="0.00">
            </div>

            <p id="msg" class="text-xs font-bold text-center hidden"></p>
            
            <button type="button" onclick="submitWIP()" id="submit-btn" class="w-full bg-black text-white font-bold py-3.5 rounded-lg text-sm hover:bg-gray-800 transition active:scale-95 cursor-pointer">
              ตัดสต๊อกเบิกคั่ว
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    async function fetchData() {
      const barcode = document.getElementById('barcode').value.trim();
      if(!barcode) return alert('กรุณาสแกนหรือพิมพ์บาร์โค้ด');

      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_inventory' }) });
        const result = await response.json();
        
        if(result.success) {
          const item = result.data.find(row => (row.barcode_id === barcode || row.pallet_id === barcode) && row.status !== 'Empty');
          if(item) {
            document.getElementById('show-name').innerText = item.item_name;
            document.getElementById('show-stock').innerText = item.weight_current;
            document.getElementById('item-info').classList.remove('hidden');
            document.getElementById('issue-qty').focus();
          } else {
            alert('ไม่พบบาร์โค้ดนี้ในระบบ หรือสินค้าหมดแล้ว');
          }
        }
      } catch (error) {}
    }

    async function submitWIP() {
      const barcode = document.getElementById('barcode').value.trim();
      const qty = document.getElementById('issue-qty').value;
      const currentStock = parseFloat(document.getElementById('show-stock').innerText);
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');

      if(!barcode || !qty) return alert('กรุณาระบุรหัสและจำนวนที่เบิก');
      if(parseFloat(qty) > currentStock) return alert('สต๊อกไม่พอเบิก! (เหลือ ' + currentStock + ' kg)');

      btn.innerText = "กำลังตัดสต๊อก...";
      btn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'issue_wip', barcode_id: barcode, used_weight: parseFloat(qty), operator: localStorage.getItem('name') || "US" })
        });
        const result = await response.json();

        msg.classList.remove('hidden');
        if(result.success) {
          msg.textContent = result.message;
          msg.className = "text-xs font-bold text-center text-black block";
          document.getElementById('show-stock').innerText = (currentStock - parseFloat(qty)).toFixed(2);
          document.getElementById('issue-qty').value = '';
          if((currentStock - parseFloat(qty)) <= 0) {
            document.getElementById('item-info').classList.add('hidden');
            document.getElementById('barcode').value = '';
          }
        }
      } catch (error) {}
      finally {
        btn.innerText = "ตัดสต๊อกเบิกคั่ว";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
