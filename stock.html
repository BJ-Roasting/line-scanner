  <script>
    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";
    let inventoryData = [];

    window.addEventListener('DOMContentLoaded', loadInventory);

    async function loadInventory() {
      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_inventory' }) });
        const result = await response.json();
        if(result.success) {
          inventoryData = result.data;
          renderTable(inventoryData);
        } else {
          document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">ดึงข้อมูลไม่สำเร็จ</td></tr>`;
        }
      } catch (error) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">เชื่อมต่อระบบไม่ได้</td></tr>`;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-400">ไม่มีข้อมูลในสต๊อก</td></tr>`;
        return;
      }
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-100 hover:bg-gray-50";
        const statusBadge = item.status === 'Active'
          ? '<span class="bg-green-500 text-white px-2 py-1 rounded text-xs font-bold">Active</span>'
          : `<span class="bg-gray-400 text-white px-2 py-1 rounded text-xs font-bold">${item.status}</span>`;
        tr.innerHTML = `
          <td class="py-2 px-4 font-bold text-blue-600">${item.barcode_id}</td>
          <td class="py-2 px-4">${item.item_name}</td>
          <td class="py-2 px-4 text-center">${item.category}</td>
          <td class="py-2 px-4 text-right font-bold text-green-700">${item.weight_current} ${item.unit}</td>
          <td class="py-2 px-4 text-center">${item.location}</td>
          <td class="py-2 px-4 text-center">${statusBadge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const filtered = inventoryData.filter(item =>
        String(item.barcode_id).toLowerCase().includes(searchText) ||
        String(item.item_name).toLowerCase().includes(searchText)
      );
      renderTable(filtered);
    }

  </script>
