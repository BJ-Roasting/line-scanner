<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - จัดส่งสินค้า (Shipping)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-blue-200">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar Desktop -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-10 pb-6 px-4 z-40 shadow-sm">
      <h2 class="text-2xl font-bold text-gray-900 mb-10 px-2">BJ Roaster</h2>
      <nav class="flex-1 space-y-2">
        <a href="index.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">หน้าแรก</a>
        <a href="planner.html" class="flex items-center gap-3 bg-blue-50 text-blue-600 px-4 py-3 rounded-xl font-bold transition">ทำงาน</a>
        <a href="report.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">รายงาน</a>
        <a href="stock.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">สต๊อกสินค้า</a>
        <a href="profile.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">โปรไฟล์</a>
      </nav>
      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-500 hover:text-red-500 px-4 py-3 rounded-xl font-bold transition">ออกจากระบบ</button>
    </aside>

    <main class="w-full md:ml-64 relative overflow-hidden flex flex-col min-h-screen">
      
      <!-- 🌟 แถบการ์ด 6 ใบ (จัดส่ง ACTIVE 🌟) -->
      <div class="sticky top-0 z-30 bg-gray-50/95 backdrop-blur-xl pt-6 pb-4 border-b border-gray-200">
        <div class="flex flex-row overflow-x-auto gap-3 px-5 md:px-10 pr-10 snap-x w-full items-center">
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-yellow-50 to-yellow-100 border border-yellow-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='planner.html'"><h2 class="text-base md:text-lg font-bold text-yellow-800 leading-tight">วางแผน<br><span class="text-xs font-medium text-yellow-600">(ออเดอร์)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-orange-50 to-orange-100 border border-orange-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='wip.html'"><h2 class="text-base md:text-lg font-bold text-orange-800 leading-tight">เบิกคั่ว<br><span class="text-xs font-medium text-orange-600">(WIP)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-purple-50 to-purple-100 border border-purple-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='packing.html'"><h2 class="text-base md:text-lg font-bold text-purple-800 leading-tight">บรรจุสินค้า<br><span class="text-xs font-medium text-purple-600">(Packing)</span></h2></div>

          <!-- 4. จัดส่ง (ACTIVE 🌟) -->
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-md bg-gradient-to-br from-teal-400 to-teal-500 border border-teal-500 cursor-default flex flex-col justify-center px-4 transform scale-105">
            <h2 class="text-base md:text-lg font-bold text-white leading-tight">จัดส่ง<br><span class="text-xs font-medium text-teal-100">(Shipping)</span></h2>
          </div>

          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-indigo-50 to-indigo-100 border border-indigo-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='item_master.html'"><h2 class="text-base md:text-lg font-bold text-indigo-800 leading-tight">เพิ่มข้อมูลใหม่<br><span class="text-xs font-medium text-indigo-600">(สาร, QR, สต๊อก)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-green-50 to-green-100 border border-green-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='inbound.html'"><h2 class="text-base md:text-lg font-bold text-green-800 leading-tight">รับสินค้าเข้า<br><span class="text-xs font-medium text-green-600">(สารกาแฟ)</span></h2></div>
        </div>
      </div>

      <!-- พื้นที่ทำงานจัดส่งสินค้า -->
      <div class="p-5 md:p-10 pb-28">
        <div class="max-w-2xl bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
          <div class="border-b pb-3">
            <h2 class="text-xl font-bold text-gray-800">🚚 ตัดสต๊อกจัดส่งสินค้า (Shipping Dispatch)</h2>
            <p class="text-xs text-gray-500 mt-1">สแกนบาร์โค้ดสินค้าเพื่อตัดสต๊อกส่งลูกค้า</p>
          </div>

          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลขออเดอร์ (Order No.) *</label>
                <input type="text" id="ship_order_no" placeholder="เช่น ORD-1002" class="w-full px-3 py-2 border rounded-xl font-bold uppercase">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ชื่อลูกค้า / ร้านค้า</label>
                <input type="text" id="ship_customer" placeholder="เช่น ร้านกาแฟ Blue Cup" class="w-full px-3 py-2 border rounded-xl">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">รหัสบาร์โค้ดสินค้าที่ส่ง *</label>
              <input type="text" id="ship_barcode" placeholder="สแกนบาร์โค้ดสินค้าสำเร็จรูป" class="w-full px-3 py-2 border rounded-xl font-bold text-teal-600 uppercase">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">จำนวนที่จัดส่ง (ถุง/ชิ้น) *</label>
              <input type="number" id="ship_qty" placeholder="ระบุจำนวน" class="w-full px-3 py-2 border rounded-xl font-bold text-teal-700">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ขนส่ง (Carrier)</label>
                <select id="ship_carrier" class="w-full px-3 py-2 border rounded-xl bg-white">
                  <option value="Kerry">Kerry Express</option>
                  <option value="Flash">Flash Express</option>
                  <option value="J&T">J&T Express</option>
                  <option value="Self-Delivery">ส่งเอง/เข้ารับที่โรงคั่ว</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลขพัสดุ (Tracking No.)</label>
                <input type="text" id="ship_tracking" placeholder="THxxxxxxxxx" class="w-full px-3 py-2 border rounded-xl uppercase">
              </div>
            </div>
          </div>

          <button type="button" onclick="submitShipping()" id="ship-btn" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-95">
            🚀 บันทึกจัดส่งและตัดสต๊อก
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    async function submitShipping() {
      const orderNo = document.getElementById('ship_order_no').value.trim();
      const customer = document.getElementById('ship_customer').value.trim();
      const barcode = document.getElementById('ship_barcode').value.trim();
      const qty = document.getElementById('ship_qty').value;
      const carrier = document.getElementById('ship_carrier').value;
      const tracking = document.getElementById('ship_tracking').value.trim();

      if(!orderNo || !barcode || !qty) return alert("กรุณากรอกเลขออเดอร์ บาร์โค้ด และจำนวนส่ง");

      const btn = document.getElementById('ship-btn');
      btn.innerText = "กำลังประมวลผล...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: 'ship_order',
            order_no: orderNo,
            customer: customer,
            barcode_id: barcode,
            qty: qty,
            carrier: carrier,
            tracking_no: tracking,
            operator: localStorage.getItem('name') || "Shipper"
          })
        });
        const result = await res.json();
        alert(result.message);
        if(result.success) {
          document.getElementById('ship_order_no').value = '';
          document.getElementById('ship_customer').value = '';
          document.getElementById('ship_barcode').value = '';
          document.getElementById('ship_qty').value = '';
          document.getElementById('ship_tracking').value = '';
        }
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ");
      } finally {
        btn.innerText = "🚀 บันทึกจัดส่งและตัดสต๊อก";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
