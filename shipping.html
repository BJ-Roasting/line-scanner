<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - จัดส่งสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-10 pb-6 px-4 z-50 shadow-sm">
      <h2 class="text-2xl font-bold text-gray-900 mb-10 px-2">BJ Roaster</h2>
      <nav class="flex-1 space-y-2">
        <a href="index.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>หน้าแรก</a>
        <a href="work.html" class="flex items-center gap-3 bg-blue-50 text-blue-600 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.78.929l-.15.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>ทำงาน</a>
        <a href="report.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>รายงาน</a>
        <a href="stock.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>สต๊อกสินค้า</a>
        <a href="profile.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>โปรไฟล์</a>
      </nav>
      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-500 hover:text-red-500 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>ออกจากระบบ</button>
    </aside>

    <main class="w-full md:ml-64 relative overflow-hidden flex flex-col min-h-screen">
      
      <!-- 🌟 ลำดับแถบการ์ดบน -->
      <div class="sticky top-0 z-40 bg-gray-50/95 backdrop-blur-xl pt-6 pb-4 border-b border-gray-200">
        <div class="flex flex-row overflow-x-auto gap-3 px-5 md:px-10 pr-10 snap-x w-full items-center">
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-yellow-50 to-yellow-100 border border-yellow-200 cursor-pointer hover:bg-yellow-100 transition px-4 flex flex-col justify-center opacity-70 hover:opacity-100" onclick="window.location.href='planner.html'"><h2 class="text-base md:text-lg font-bold text-yellow-800 leading-tight">วางแผน<br><span class="text-xs font-medium text-yellow-600">(ออเดอร์)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-orange-50 to-orange-100 border border-orange-200 cursor-pointer hover:bg-orange-100 transition px-4 flex flex-col justify-center opacity-70 hover:opacity-100" onclick="window.location.href='wip.html'"><h2 class="text-base md:text-lg font-bold text-orange-800 leading-tight">เบิกคั่ว<br><span class="text-xs font-medium text-orange-600">(WIP)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-purple-50 to-purple-100 border border-purple-200 cursor-pointer hover:bg-purple-100 transition px-4 flex flex-col justify-center opacity-70 hover:opacity-100" onclick="window.location.href='packing.html'"><h2 class="text-base md:text-lg font-bold text-purple-800 leading-tight">บรรจุสินค้า<br><span class="text-xs font-medium text-purple-600">(Packing)</span></h2></div>

          <!-- 4. จัดส่ง (ACTIVE 🌟) -->
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-md bg-gradient-to-br from-teal-400 to-teal-500 border border-teal-500 cursor-default flex flex-col justify-center px-4 transform scale-105">
            <h2 class="text-base md:text-lg font-bold text-white leading-tight">จัดส่ง<br><span class="text-xs font-medium text-teal-100">(Shipping)</span></h2>
          </div>

          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-indigo-50 to-indigo-100 border border-indigo-200 cursor-pointer hover:bg-indigo-100 transition px-4 flex flex-col justify-center opacity-70 hover:opacity-100" onclick="window.location.href='item_master.html'"><h2 class="text-base md:text-lg font-bold text-indigo-800 leading-tight">เพิ่มข้อมูลใหม่<br><span class="text-xs font-medium text-indigo-600">(สาร, Sup)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-green-50 to-green-100 border border-green-200 cursor-pointer hover:bg-green-100 transition px-4 flex flex-col justify-center opacity-70 hover:opacity-100" onclick="window.location.href='work.html'"><h2 class="text-base md:text-lg font-bold text-green-800 leading-tight">รับสินค้าเข้า<br><span class="text-xs font-medium text-green-600">(สารกาแฟ)</span></h2></div>
        </div>
      </div>

      <!-- ฟอร์มจัดส่ง -->
      <div class="p-5 md:p-10 pb-28">
        <div class="max-w-2xl bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
          <div class="border-b pb-3">
            <h2 class="text-xl font-bold text-gray-800">🚚 ตัดสต๊อกจัดส่งสินค้า (Shipping Dispatch)</h2>
            <p class="text-xs text-gray-500 mt-1">สแกนบาร์โค้ดสินค้าเพื่อตัดสต๊อกส่งลูกค้า</p>
          </div>

          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลขออเดอร์ (Order No.) *</label>
                <input type="text" id="ship_order_no" placeholder="เช่น ORD-1002" class="w-full px-3 py-2 border rounded-xl font-bold">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ชื่อลูกค้า / ร้านค้า</label>
                <input type="text" id="ship_customer" placeholder="เช่น ร้านกาแฟ Blue Cup" class="w-full px-3 py-2 border rounded-xl">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">รหัสบาร์โค้ดสินค้าที่ส่ง *</label>
              <input type="text" id="ship_barcode" placeholder="สแกนบาร์โค้ดสินค้าสำเร็จรูป" class="w-full px-3 py-2 border rounded-xl font-bold text-teal-600">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">จำนวนที่จัดส่ง (ถุง/ชิ้น) *</label>
              <input type="number" id="ship_qty" placeholder="ระบุจำนวน" class="w-full px-3 py-2 border rounded-xl font-bold text-teal-700">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ขนส่ง (Carrier)</label>
                <select id="ship_carrier" class="w-full px-3 py-2 border rounded-xl bg-white">
                  <option value="Kerry">Kerry Express</option>
                  <option value="Flash">Flash Express</option>
                  <option value="J&T">J&T Express</option>
                  <option value="Self-Delivery">ส่งเอง/เข้ารับที่โรงคั่ว</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลขพัสดุ (Tracking No.)</label>
                <input type="text" id="ship_tracking" placeholder="THxxxxxxxxx" class="w-full px-3 py-2 border rounded-xl">
              </div>
            </div>
          </div>

          <button onclick="submitShipping()" id="ship-btn" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">🚀 บันทึกจัดส่งและตัดสต๊อก</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    async function submitShipping() {
      const orderNo = document.getElementById('ship_order_no').value.trim();
      const customer = document.getElementById('ship_customer').value.trim();
      const barcode = document.getElementById('ship_barcode').value.trim();
      const qty = document.getElementById('ship_qty').value;
      const carrier = document.getElementById('ship_carrier').value;
      const tracking = document.getElementById('ship_tracking').value.trim();
      const operator = localStorage.getItem('name') || "US";

      if(!orderNo || !barcode || !qty) return alert("กรุณากรอกเลขออเดอร์ บาร์โค้ด และจำนวนส่ง");

      const btn = document.getElementById('ship-btn');
      btn.innerText = "กำลังประมวลผล...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: 'ship_order',
            order_no: orderNo,
            customer: customer,
            barcode_id: barcode,
            qty: qty,
            carrier: carrier,
            tracking_no: tracking,
            operator: operator
          })
        });
        const result = await res.json();
        alert(result.message);
        if(result.success) {
          document.querySelectorAll('input').forEach(i => i.value = '');
        }
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ");
      }
      btn.innerText = "🚀 บันทึกจัดส่งและตัดสต๊อก";
      btn.disabled = false;
    }
  </script>
</body>
</html>
