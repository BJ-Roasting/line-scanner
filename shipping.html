        <!-- ฟอร์มตัดสต๊อกจัดส่งสินค้า -->
        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
          <div class="border-b border-gray-100 pb-3">
            <h2 class="text-base font-bold text-black">ตัดสต๊อกจัดส่งสินค้า</h2>
            <p class="text-xs text-gray-400">สแกนบาร์โค้ดสินค้าสำเร็จรูปเพื่อตัดส่งให้ลูกค้า</p>
          </div>

          <div class="space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">เลขออเดอร์ลูกค้า *</label>
                <input type="text" id="ship_order_no" placeholder="เช่น ORD-1002" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-bold text-black uppercase text-sm focus:border-black focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">ชื่อลูกค้า / ร้านค้า</label>
                <input type="text" id="ship_customer" list="customer-list" placeholder="เลือกลูกค้าหรือพิมพ์" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-black focus:border-black focus:outline-none">
                <datalist id="customer-list"></datalist>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">รหัสบาร์โค้ดสินค้าที่ส่ง *</label>
              <input type="text" id="ship_barcode" placeholder="สแกนบาร์โค้ดสินค้า" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-mono font-bold text-black uppercase text-sm focus:border-black focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">จำนวนที่จัดส่ง (ถุง) *</label>
              <input type="number" id="ship_qty" placeholder="ระบุจำนวน" class="w-full px-3 py-2 border border-black rounded-lg font-black text-black text-base focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ขนส่ง (Carrier)</label>
                <select id="ship_carrier" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white text-xs font-medium focus:border-black focus:outline-none">
                  <option value="Kerry">Kerry Express</option>
                  <option value="Flash">Flash Express</option>
                  <option value="J&T">J&T Express</option>
                  <option value="Self-Delivery">ส่งเอง / เข้ารับที่โรงคั่ว</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลขพัสดุ (Tracking No.)</label>
                <input type="text" id="ship_tracking" placeholder="THxxxxxxxxx" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs uppercase font-mono">
              </div>
            </div>
          </div>

          <button type="button" onclick="submitShipping()" id="ship-btn" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-lg text-sm transition active:scale-95 cursor-pointer">
            ยืนยันจัดส่งและตัดสต๊อก
          </button>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    window.onload = loadCustomerOptions;

    async function loadCustomerOptions() {
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_customers' }) });
        const result = await res.json();
        if(result.success && result.data) {
          const list = document.getElementById('customer-list');
          list.innerHTML = result.data.map(c => `<option value="${c.customer_name}">`).join('');
        }
      } catch (e) {}
    }

    async function submitShipping() {
      const orderNo = document.getElementById('ship_order_no').value.trim();
      const customer = document.getElementById('ship_customer').value.trim();
      const barcode = document.getElementById('ship_barcode').value.trim();
      const qty = document.getElementById('ship_qty').value;
      const carrier = document.getElementById('ship_carrier').value;
      const tracking = document.getElementById('ship_tracking').value.trim();

      if(!orderNo || !barcode || !qty) return alert("กรุณากรอกเลขออเดอร์ บาร์โค้ด และจำนวนส่ง");

      const btn = document.getElementById('ship-btn');
      btn.innerText = "กำลังประมวลผล...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: 'ship_order',
            order_no: orderNo,
            customer: customer,
            barcode_id: barcode,
            qty: qty,
            carrier: carrier,
            tracking_no: tracking,
            operator: localStorage.getItem('name') || "Shipper"
          })
        });
        const result = await res.json();
        alert(result.message);
        if(result.success) {
          document.getElementById('ship_order_no').value = '';
          document.getElementById('ship_customer').value = '';
          document.getElementById('ship_barcode').value = '';
          document.getElementById('ship_qty').value = '';
          document.getElementById('ship_tracking').value = '';
        }
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ");
      } finally {
        btn.innerText = "ยืนยันจัดส่งและตัดสต๊อก";
        btn.disabled = false;
      }
    }
  </script>
