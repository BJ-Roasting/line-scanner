<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - วางแผนการคั่ว</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased selection:bg-gray-200">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar Desktop -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-8 pb-6 px-4 z-40 shadow-sm">
      <h2 class="text-xl font-black text-black mb-8 px-2 tracking-tight">BJ ROASTER</h2>
      <nav class="flex-1 space-y-1">
        <a href="index.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">หน้าแรก</a>
        <a href="planner.html" class="flex items-center gap-3 bg-black text-white px-3.5 py-2.5 rounded-lg font-bold text-sm transition">ทำงาน</a>
        <a href="report.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">รายงาน</a>
        <a href="stock.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">สต๊อกสินค้า</a>
        <a href="profile.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3.5 py-2.5 rounded-lg font-bold text-sm transition">โปรไฟล์</a>
      </nav>
      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-400 hover:text-black px-3.5 py-2.5 rounded-lg font-bold text-sm transition">ออกจากระบบ</button>
    </aside>

    <main class="w-full md:ml-64 relative flex flex-col min-h-screen">
      
      <!-- 🌟 แถบเมนูด้านบน สไตล์ Binance Tab Header (ข้อความล้วน ขาว-ดำ) 🌟 -->
      <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200">
        <div class="flex items-center gap-2 overflow-x-auto px-4 md:px-8 py-2.5 snap-x">
          <!-- Active Tab: วางแผน -->
          <button class="px-4 py-2 rounded-lg text-sm font-bold bg-black text-white whitespace-nowrap shadow-sm">วางแผน</button>
          <button onclick="window.location.href='wip.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">เบิกคั่ว</button>
          <button onclick="window.location.href='packing.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">บรรจุสินค้า</button>
          <button onclick="window.location.href='shipping.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">จัดส่ง</button>
          <button onclick="window.location.href='item_master.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">เพิ่มข้อมูลใหม่</button>
          <button onclick="window.location.href='inbound.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">รับสินค้าเข้า</button>
        </div>
      </div>

      <!-- เนื้อหาหลัก -->
      <div class="p-4 md:p-8 pb-28 max-w-4xl space-y-6">
        
        <!-- ฟอร์มสร้างแผนการคั่ว -->
        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
          <div class="border-b border-gray-100 pb-3">
            <h2 class="text-base font-bold text-black">สร้างแผนการคั่ว (Roasting Plan)</h2>
            <p class="text-xs text-gray-400">กำหนดแผนและระดับการคั่วสำหรับเข้าเตา</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">เลขออเดอร์ลูกค้า *</label>
              <input type="text" id="order_no" placeholder="เช่น ORD-2026-001" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-bold uppercase">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">สารกาแฟที่จะใช้คั่ว *</label>
              <input type="text" id="plan_item_name" placeholder="เช่น Brazil Cerrado" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">น้ำหนักสารกาแฟเป้าหมาย (kg) *</label>
              <input type="number" id="plan_weight" placeholder="30.00" class="w-full px-3 py-2 border border-black rounded-lg text-base font-black">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">ระดับการคั่ว (Profile) *</label>
              <select id="roast_level" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white font-bold">
                <option value="Light">Light (คั่วอ่อน)</option>
                <option value="Medium">Medium (คั่วกลาง)</option>
                <option value="Medium-Dark">Medium-Dark (คั่วกลางเข้ม)</option>
                <option value="Dark">Dark (คั่วเข้ม)</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-bold text-gray-600 mb-1">วันที่กำหนดคั่ว</label>
              <input type="date" id="roast_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
          </div>

          <button type="button" onclick="savePlan()" id="save-plan-btn" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 rounded-lg text-sm transition active:scale-95 cursor-pointer">
            บันทึกแผนการคั่ว
          </button>
        </div>

        <!-- รายการคิวคั่วทั้งหมด -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-bold text-black text-sm">คิวแผนการคั่ว</h3>
            <button type="button" onclick="loadPlans()" class="text-xs bg-gray-100 hover:bg-gray-200 text-black font-bold px-3 py-1.5 rounded-lg transition cursor-pointer">รีเฟรช</button>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-xs">
              <thead class="bg-gray-50 text-gray-500 border-b border-gray-200">
                <tr>
                  <th class="py-2.5 px-3 text-left font-bold">รหัสแผน / ออเดอร์</th>
                  <th class="py-2.5 px-3 text-left font-bold">สารกาแฟ</th>
                  <th class="py-2.5 px-3 text-right font-bold">น้ำหนัก</th>
                  <th class="py-2.5 px-3 text-center font-bold">ระดับคั่ว</th>
                  <th class="py-2.5 px-3 text-center font-bold">สถานะ</th>
                  <th class="py-2.5 px-3 text-center font-bold">จัดการ</th>
                </tr>
              </thead>
              <tbody id="plan-table-body" class="text-black divide-y divide-gray-100">
                <tr><td colspan="6" class="py-6 text-center text-gray-400">กำลังโหลด...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    window.onload = loadPlans;

    async function loadPlans() {
      const tbody = document.getElementById('plan-table-body');
      tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">กำลังโหลด...</td></tr>`;
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_plans' }) });
        const result = await res.json();
        if(result.success && result.data && result.data.length > 0) {
          tbody.innerHTML = result.data.map(p => `
            <tr class="hover:bg-gray-50">
              <td class="py-2 px-3 font-mono font-bold text-black">${p.plan_id}<br><span class="text-[10px] text-gray-400 font-normal">${p.order_no || '-'}</span></td>
              <td class="py-2 px-3 text-black font-medium">${p.item_name}</td>
              <td class="py-2 px-3 text-right font-bold text-black">${p.target_weight} kg</td>
              <td class="py-2 px-3 text-center">${p.roast_level}</td>
              <td class="py-2 px-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold border border-gray-300 ${p.status === 'Completed' ? 'bg-gray-100 text-black' : 'text-gray-500'}">${p.status}</span></td>
              <td class="py-2 px-3 text-center">
                ${p.status !== 'Completed' ? `<button type="button" onclick="updateStatus('${p.plan_id}', 'Completed')" class="text-black hover:underline font-bold cursor-pointer">เสร็จสิ้น</button>` : '—'}
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">ยังไม่มีแผนการคั่ว</td></tr>`;
        }
      } catch (e) {}
    }

    async function savePlan() {
      const orderNo = document.getElementById('order_no').value.trim();
      const itemName = document.getElementById('plan_item_name').value.trim();
      const weight = document.getElementById('plan_weight').value;
      const roastLevel = document.getElementById('roast_level').value;
      const roastDate = document.getElementById('roast_date').value;

      if(!itemName || !weight) return alert("กรุณาระบุชื่อสารกาแฟและน้ำหนัก");

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'add_plan', order_no: orderNo, item_name: itemName, target_weight: weight, roast_level: roastLevel, roast_date: roastDate, operator: localStorage.getItem('name') || "Admin" })
        });
        document.getElementById('order_no').value = '';
        document.getElementById('plan_item_name').value = '';
        document.getElementById('plan_weight').value = '';
        loadPlans();
      } catch (e) {}
    }

    async function updateStatus(planId, status) {
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'update_plan_status', plan_id: planId, status: status }) });
        loadPlans();
      } catch (e) {}
    }
  </script>
</body>
</html>
