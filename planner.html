            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-bold text-gray-600 mb-1">วันที่กำหนดคั่ว</label>
              <input type="date" id="roast_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-black focus:outline-none">
            </div>
          </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    window.onload = loadPlans;

    async function loadPlans() {
      const tbody = document.getElementById('plan-table-body');
      tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">กำลังโหลด...</td></tr>`;
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_plans' }) });
        const result = await res.json();
        if(result.success && result.data && result.data.length > 0) {
          tbody.innerHTML = result.data.map(p => `
            <tr class="hover:bg-gray-50">
              <td class="py-2 px-3 font-mono font-bold text-black">${p.plan_id}<br><span class="text-[10px] text-gray-400 font-normal">${p.order_no || '-'}</span></td>
              <td class="py-2 px-3 text-black font-medium">${p.item_name}</td>
              <td class="py-2 px-3 text-right font-bold text-black">${p.target_weight} kg</td>
              <td class="py-2 px-3 text-center">${p.roast_level}</td>
              <td class="py-2 px-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold border border-gray-300 ${p.status === 'Completed' ? 'bg-gray-100 text-black' : 'text-gray-500'}">${p.status}</span></td>
              <td class="py-2 px-3 text-center">
                ${p.status !== 'Completed' ? `<button type="button" onclick="updateStatus('${p.plan_id}', 'Completed')" class="text-black hover:underline font-bold cursor-pointer">เสร็จสิ้น</button>` : '—'}
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">ยังไม่มีแผนการคั่ว</td></tr>`;
        }
      } catch (e) {}
    }

    async function savePlan() {
      const orderNo = document.getElementById('order_no').value.trim();
      const itemName = document.getElementById('plan_item_name').value.trim();
      const weight = document.getElementById('plan_weight').value;
      const roastLevel = document.getElementById('roast_level').value;
      const roastDate = document.getElementById('roast_date').value;

      if(!itemName || !weight) return alert("กรุณาระบุชื่อสารกาแฟและน้ำหนัก");

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'add_plan', order_no: orderNo, item_name: itemName, target_weight: weight, roast_level: roastLevel, roast_date: roastDate, operator: localStorage.getItem('name') || "Admin" })
        });
        document.getElementById('order_no').value = '';
        document.getElementById('plan_item_name').value = '';
        document.getElementById('plan_weight').value = '';
        loadPlans();
      } catch (e) {}
    }

    async function updateStatus(planId, status) {
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'update_plan_status', plan_id: planId, status: status }) });
        loadPlans();
      } catch (e) {}
    }
  </script>
