<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-blue-200">

  <!-- =========================== -->
  <!-- 🔒 หน้า LOGIN -->
  <!-- =========================== -->
  <div id="login-card" class="min-h-screen flex flex-col justify-center items-center p-6 bg-gray-50">
    <div class="w-full max-w-sm">
      <h1 class="text-4xl font-bold text-center mb-2 text-gray-900">BJ Roaster</h1>
      <p class="text-gray-500 text-center mb-8">ลงชื่อเข้าใช้ระบบจัดการโรงคั่ว</p>
      <div class="space-y-4 bg-white p-6 rounded-2xl border border-gray-200 shadow-xl">
        <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 text-gray-900 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="รหัสพนักงาน">
        <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 text-gray-900 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="รหัสผ่าน">
        <div class="flex items-center mt-2">
          <input type="checkbox" id="remember-me" class="w-5 h-5 accent-blue-600 rounded">
          <label class="ml-2 text-sm text-gray-600">ล็อกอินอัตโนมัติ</label>
        </div>
        <p id="error-msg" class="text-red-500 text-sm hidden text-center font-medium"></p>
        <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition shadow-md">เข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <!-- =========================== -->
  <!-- 💻 & 📱 หน้า DASHBOARD หลัก -->
  <!-- =========================== -->
  <div id="dashboard" class="hidden flex min-h-screen">
    
    <!-- 💻 Sidebar สำหรับ Desktop (ตาม Map: 5 ปุ่มหลัก เรียบง่าย) -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-10 pb-6 px-4 z-50 shadow-sm">
      <h2 class="text-2xl font-bold text-gray-900 mb-10 px-2">BJ Roaster</h2>
      
      <nav class="flex-1 space-y-2">
        <!-- 1. หน้าแรก (Active อยู่หน้านี้) -->
        <a href="index.html" class="flex items-center gap-3 bg-blue-50 text-blue-600 px-4 py-3 rounded-xl font-bold transition">
          🏠 หน้าแรก
        </a>
        <!-- 2. ทำงาน (กดแล้วจะไปหน้า work.html) -->
        <a href="work.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">
          ⚙️ ทำงาน
        </a>
        <!-- 3. รายงาน -->
        <a href="report.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">
          📊 รายงาน
        </a>
        <!-- 4. สต๊อกสินค้า -->
        <a href="stock.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">
          📦 สต๊อกสินค้า
        </a>
        <!-- 5. โปรไฟล์ -->
        <a href="profile.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">
          👤 โปรไฟล์
        </a>
      </nav>

      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-500 hover:text-red-500 px-4 py-3 rounded-xl font-bold transition">
        🚪 ออกจากระบบ
      </button>
    </aside>

    <!-- 📱 พื้นที่แสดงผลฝั่งขวา (สำหรับหน้าแรก) -->
    <main class="w-full md:ml-64 p-5 md:p-10 pb-28 md:pb-10 relative">
      
      <!-- Header -->
      <div class="flex justify-between items-center mb-8 sticky top-0 bg-gray-50/90 backdrop-blur-xl z-30 py-3 border-b border-gray-200 md:border-none md:bg-transparent px-1">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-100 rounded-full flex items-center justify-center border border-blue-200 shadow-sm">
            <span id="profile-initial" class="text-lg md:text-xl font-bold text-blue-700">CM</span>
          </div>
          <div>
            <p id="current-date" class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-1"></p>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">ภาพรวมระบบ</h1>
          </div>
        </div>
        <button onclick="handleLogout()" class="md:hidden flex items-center justify-center w-10 h-10 bg-red-50 text-red-500 rounded-full border border-red-100">
          🚪
        </button>
      </div>

      <!-- ส่วนนี้เตรียมไว้สำหรับ Dashboard กราฟ/ยอดภาพรวม ในอนาคต -->
      <div class="bg-white p-10 rounded-2xl border border-gray-200 shadow-sm text-center">
        <h2 class="text-2xl font-bold text-gray-400">📊 พื้นที่สำหรับแสดงภาพรวม</h2>
        <p class="text-gray-400 mt-2">ยอดจัดส่ง, สต๊อกสาร, Planner ฯลฯ จะมาแสดงที่หน้านี้</p>
      </div>

    </main>
  </div>

  <!-- =========================== -->
  <!-- 📱 Bottom Navigation (สำหรับมือถือ) -->
  <!-- =========================== -->
  <div id="bottom-nav" class="hidden fixed bottom-0 w-full bg-white/95 backdrop-blur-xl border-t border-gray-200 pb-safe z-40 md:hidden shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)]">
    <div class="flex justify-around items-center pt-3 pb-2 px-1">
      <div class="flex flex-col items-center justify-center w-[20%] text-blue-600 cursor-pointer">
        <span class="text-2xl mb-1">🏠</span><span class="text-[10px] font-bold">หน้าแรก</span>
      </div>
      <!-- เปลี่ยนให้ลิงก์ไปหน้า work.html โดยตรง -->
      <div onclick="window.location.href='work.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <span class="text-2xl mb-1 grayscale opacity-70">⚙️</span><span class="text-[10px] font-medium">ทำงาน</span>
      </div>
      <div onclick="window.location.href='report.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <span class="text-2xl mb-1 grayscale opacity-70">📊</span><span class="text-[10px] font-medium">รายงาน</span>
      </div>
      <div onclick="window.location.href='stock.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <span class="text-2xl mb-1 grayscale opacity-70">📦</span><span class="text-[10px] font-medium">สต๊อก</span>
      </div>
      <div onclick="window.location.href='profile.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <span class="text-2xl mb-1 grayscale opacity-70">👤</span><span class="text-[10px] font-medium">โปรไฟล์</span>
      </div>
    </div>
  </div>

  <!-- =========================== -->
  <!-- ⚙️ SCRIPT -->
  <!-- =========================== -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    const options = { weekday: 'long', day: 'numeric', month: 'long' };
    const dateEl = document.getElementById('current-date');
    if (dateEl) dateEl.innerText = new Date().toLocaleDateString('th-TH', options);

    window.onload = function() {
      if(localStorage.getItem('isLoggedIn') === 'true') showDashboard();
    };

    function showDashboard() {
      document.getElementById('login-card').classList.add('hidden');
      const dashboard = document.getElementById('dashboard');
      dashboard.classList.remove('hidden');
      dashboard.classList.add('flex');
      document.getElementById('bottom-nav').classList.remove('hidden');
      
      let name = localStorage.getItem('name') || "US";
      document.getElementById('profile-initial').innerText = name.substring(0, 2).toUpperCase();
    }

    async function handleLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const btn = document.getElementById('login-btn');
      const errorMsg = document.getElementById('error-msg');

      if(!user || !pass) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

      btn.innerText = "กำลังตรวจสอบ...";
      btn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'login', username: user, password: pass }),
        });
        const result = await response.json();

        if(result.success) {
          if(rememberMe) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('name', result.name);
            localStorage.setItem('role', result.role);
          } else {
            localStorage.setItem('name', result.name);
          }
          showDashboard();
        } else {
          errorMsg.textContent = result.message;
          errorMsg.classList.remove('hidden');
        }
      } catch (error) {
        errorMsg.textContent = "เชื่อมต่อฐานข้อมูลไม่ได้";
        errorMsg.classList.remove('hidden');
      }
      btn.innerText = "เข้าสู่ระบบ";
      btn.disabled = false;
    }

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
