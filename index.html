<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJ Roaster - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <!-- กล่อง Login -->
  <div id="login-card" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">ระบบจัดการโรงคั่วกาแฟ</h1>
    
    <div class="space-y-4">
      <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-amber-500" placeholder="รหัสพนักงาน (Username)">
      <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-amber-500" placeholder="รหัสผ่าน (Password)">
      
      <div class="flex items-center">
        <input type="checkbox" id="remember-me" class="w-4 h-4 text-amber-600 border-gray-300 rounded focus:ring-amber-500">
        <label for="remember-me" class="ml-2 block text-sm text-gray-700">ล็อกอินอัตโนมัติในครั้งถัดไป</label>
      </div>

      <p id="error-msg" class="text-red-500 text-sm hidden"></p>
      
      <button onclick="handleLogin()" id="login-btn" class="w-full bg-amber-600 text-white font-bold py-2 rounded-lg hover:bg-amber-700">
        เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <!-- หน้า Dashboard (หลังล็อกอินสำเร็จ) -->
  <div id="dashboard" class="hidden text-center w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">ยินดีต้อนรับเข้าสู่กะทำงาน!</h1>
    <h2 id="welcome-name" class="text-xl text-amber-600 font-semibold mb-4"></h2>
    <p id="user-role" class="text-gray-500 mb-6"></p>
    
    <!-- กลุ่มปุ่มเมนูต่างๆ -->
    <div class="space-y-3 mb-6">
      <button onclick="window.location.href='inbound.html'" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 shadow-md">
        📥 รับสารกาแฟเข้าสต๊อก (Inbound)
      </button>
      
      <button onclick="window.location.href='inventory.html'" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-md">
        📦 ดูสต๊อกสินค้า (Inventory)
      </button>
      
      <button onclick="window.location.href='wip.html'" class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg hover:bg-orange-600 shadow-md">
        🔥 เบิกสารกาแฟไปคั่ว (WIP)
      </button>
      
      <button onclick="window.location.href='location.html'" class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 shadow-md">
        📍 จัดการจุดจัดเก็บ (Location Setup)
      </button>
    </div>
    
    <button onclick="handleLogout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded shadow hover:bg-gray-300 w-full font-bold">ออกจากระบบ</button>
  </div>

  <script>
    // ⚠️ อย่าลืม! นำ URL Web App ของคุณมาใส่ตรงนี้เหมือนเดิมครับ
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    window.onload = function() {
      if(localStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('welcome-name').innerText = "คุณ " + localStorage.getItem('name');
        document.getElementById('user-role').innerText = "ตำแหน่ง: " + localStorage.getItem('role');
      }
    };

    async function handleLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const btn = document.getElementById('login-btn');
      const errorMsg = document.getElementById('error-msg');

      if(!user || !pass) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

      btn.innerText = "กำลังตรวจสอบ...";
      btn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'login', username: user, password: pass }),
        });
        
        const result = await response.json();

        if(result.success) {
          if(rememberMe) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('name', result.name);
            localStorage.setItem('role', result.role);
          }
          document.getElementById('login-card').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('welcome-name').innerText = "คุณ " + result.name;
          document.getElementById('user-role').innerText = "ตำแหน่ง: " + result.role;
        } else {
          errorMsg.textContent = result.message;
          errorMsg.classList.remove('hidden');
        }
      } catch (error) {
        errorMsg.textContent = "เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้งครับ";
        errorMsg.classList.remove('hidden');
      }
      
      btn.innerText = "เข้าสู่ระบบ";
      btn.disabled = false;
    }

    function handleLogout() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
