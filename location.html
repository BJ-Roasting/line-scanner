<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการจุดจัดเก็บ (Location)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md mt-4">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">📍 จัดการจุดจัดเก็บ (Location Setup)</h1>
      <button onclick="window.location.href='index.html'" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold hover:bg-gray-300">กลับหน้าหลัก</button>
    </div>

    <!-- ฟอร์มเพิ่ม Location -->
    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 mb-6">
      <h2 class="font-bold text-blue-800 mb-3">➕ เพิ่ม Location ใหม่</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <input type="text" id="loc_name" placeholder="ชื่อ Location (เช่น Rack-A)" class="px-3 py-2 border rounded">
        <select id="loc_type" class="px-3 py-2 border rounded text-gray-700">
          <option value="Storage">Storage (พื้นที่เก็บ)</option>
          <option value="WIP">WIP (กำลังผลิต/หน้าเตา)</option>
          <option value="Dispatch">Dispatch (รอส่งออก)</option>
        </select>
        <select id="loc_status" class="px-3 py-2 border rounded text-gray-700">
          <option value="In-Stock">In-Stock</option>
          <option value="Working">Working</option>
          <option value="Out">Out</option>
        </select>
        <button onclick="addLocation()" id="add-btn" class="bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">บันทึก</button>
      </div>
      <p id="msg" class="text-sm text-center mt-2 font-bold hidden"></p>
    </div>

    <!-- ตารางแสดง Location -->
    <table class="min-w-full bg-white border">
      <thead class="bg-gray-800 text-white">
        <tr>
          <th class="py-2 px-4 border text-left">ชื่อ Location</th>
          <th class="py-2 px-4 border text-left">ประเภท</th>
          <th class="py-2 px-4 border text-center">สถานะอัตโนมัติ</th>
          <th class="py-2 px-4 border text-center">จัดการ</th>
        </tr>
      </thead>
      <tbody id="table-body" class="text-gray-700">
        <tr><td colspan="4" class="py-4 text-center">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ นำ URL Web App ของคุณมาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    window.onload = loadLocations;

    async function loadLocations() {
      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_locations' }) });
        const result = await response.json();
        
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        if(result.success && result.data.length > 0) {
          result.data.forEach(loc => {
            tbody.innerHTML += `
              <tr class="border-b">
                <td class="py-2 px-4 border font-bold">${loc.name}</td>
                <td class="py-2 px-4 border">${loc.type}</td>
                <td class="py-2 px-4 border text-center"><span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs">${loc.status}</span></td>
                <td class="py-2 px-4 border text-center">
                  <button onclick="deleteLocation('${loc.name}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">ลบ</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center">ยังไม่มีข้อมูล</td></tr>`;
        }
      } catch (e) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-500">เชื่อมต่อระบบไม่ได้</td></tr>`;
      }
    }

    async function addLocation() {
      const name = document.getElementById('loc_name').value;
      const type = document.getElementById('loc_type').value;
      const status = document.getElementById('loc_status').value;
      const msg = document.getElementById('msg');
      
      if(!name) return alert("กรุณาใส่ชื่อ Location");
      
      document.getElementById('add-btn').innerText = "...";
      
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: 'add_location', name: name, type: type, status: status, desc: '' })
      });
      const data = await res.json();
      
      msg.textContent = data.message;
      msg.className = data.success ? "text-sm text-green-600 mt-2 font-bold block" : "text-sm text-red-500 mt-2 font-bold block";
      
      if(data.success) {
        document.getElementById('loc_name').value = '';
        loadLocations();
      }
      document.getElementById('add-btn').innerText = "บันทึก";
    }

    async function deleteLocation(name) {
      if(!confirm(`ต้องการลบ ${name} ใช่หรือไม่?`)) return;
      
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: 'delete_location', name: name })
      });
      const data = await res.json();
      if(data.success) loadLocations();
      else alert(data.message);
    }
  </script>
</body>
</html>
