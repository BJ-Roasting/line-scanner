<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJ Roaster - จัดการจุดจัดเก็บ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b border-gray-200 pb-4">
      <div>
        <h1 class="text-xl font-black text-black tracking-tight">จัดการจุดจัดเก็บ Rack I (BJI01A - BJI05M)</h1>
        <p class="text-xs text-gray-400 mt-0.5">คลัง BJ | 5 ชั้น (01-05) | 13 ช่อง (A-M) รวม 65 จุด</p>
      </div>
      <div class="flex gap-2">
        <button onclick="window.location.href='stock.html'" class="bg-black hover:bg-gray-800 text-white px-3.5 py-1.5 rounded-lg font-bold text-xs transition">ดูสต๊อกสินค้า</button>
        <button onclick="window.location.href='index.html'" class="bg-gray-100 text-black px-3.5 py-1.5 rounded-lg font-bold text-xs hover:bg-gray-200 transition">กลับหน้าหลัก</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- เพิ่มเอง -->
      <div class="md:col-span-2 bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-3">
        <h2 class="font-bold text-black text-sm">เพิ่ม Location กำหนดเอง</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
          <div>
            <label class="block font-bold text-gray-500 mb-1">ชื่อ Location *</label>
            <input type="text" id="loc_name" placeholder="เช่น BJI02B" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg font-bold uppercase focus:border-black focus:outline-none">
          </div>
          <div>
            <label class="block font-bold text-gray-500 mb-1">ประเภท</label>
            <select id="loc_type" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg bg-white">
              <option value="Rack">Rack (ชั้นวาง)</option>
              <option value="Floor">Floor (ลานกอง)</option>
              <option value="Station">Station (แท่นผลิต)</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-gray-500 mb-1">สถานะ</label>
            <select id="loc_status" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg bg-white font-bold">
              <option value="In">In (เก็บสินค้า)</option>
              <option value="Working">Working (ผลิต/WIP)</option>
              <option value="Packing">Packing (บรรจุ)</option>
              <option value="Out">Out (จ่ายออก)</option>
            </select>
          </div>
        </div>
        <button onclick="addSingleLocation()" id="btn-add-single" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-2 rounded-lg text-xs transition">บันทึก Location</button>
      </div>

      <!-- ปุ่มสร้าง 65 ช่อง -->
      <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="font-bold text-black text-sm">สร้างผัง Rack I ทั้งหมด</h2>
          <p class="text-xs text-gray-500 mt-1">สร้าง 65 ช่องอัตโนมัติ (BJI01A ถึง BJI05M)</p>
        </div>
        <button onclick="generateRacksBatch()" id="btn-batch-gen" class="mt-3 bg-white hover:bg-gray-100 text-black border border-black font-bold py-2 rounded-lg text-xs transition">
          สร้าง 65 ช่องอัตโนมัติ
        </button>
      </div>
    </div>

    <!-- ตารางรายการ Location -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="p-3.5 border-b border-gray-100 flex justify-between items-center">
        <span class="font-bold text-black text-xs">รายชื่อ Location ทั้งหมด (<span id="loc-count">0</span>)</span>
        <select id="filter-status" onchange="filterLocations()" class="px-2 py-1 border border-gray-300 rounded text-xs bg-white">
          <option value="ALL">แสดงทุกสถานะ</option>
          <option value="In">In</option>
          <option value="Working">Working</option>
          <option value="Packing">Packing</option>
          <option value="Out">Out</option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-xs">
          <thead class="bg-gray-50 text-gray-500 border-b border-gray-200">
            <tr>
              <th class="py-2 px-3 text-left font-bold">ชื่อ Location</th>
              <th class="py-2 px-3 text-center font-bold">ประเภท</th>
              <th class="py-2 px-3 text-center font-bold">สถานะ</th>
              <th class="py-2 px-3 text-center font-bold">เปลี่ยนสถานะ</th>
              <th class="py-2 px-3 text-center font-bold">จัดการ</th>
            </tr>
          </thead>
          <tbody id="loc-table-body" class="text-black divide-y divide-gray-100">
            <tr><td colspan="5" class="py-6 text-center text-gray-400">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";
    let allLocations = [];

    window.onload = loadLocations;

    async function loadLocations() {
      const tbody = document.getElementById('loc-table-body');
      tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">กำลังโหลด...</td></tr>`;
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'get_locations' }) });
        const result = await res.json();
        if(result.success && result.data) {
          allLocations = result.data;
          document.getElementById('loc-count').innerText = `${allLocations.length} จุด`;
          renderLocationTable(allLocations);
        }
      } catch (e) {}
    }

    function renderLocationTable(data) {
      const tbody = document.getElementById('loc-table-body');
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">ไม่พบข้อมูล</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(loc => `
        <tr class="hover:bg-gray-50">
          <td class="py-2 px-3 font-mono font-bold text-black">${loc.name}</td>
          <td class="py-2 px-3 text-center text-gray-500">${loc.type || 'Rack'}</td>
          <td class="py-2 px-3 text-center">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold border border-gray-300 ${loc.status === 'In' ? 'bg-black text-white' : 'text-gray-600'}">${loc.status}</span>
          </td>
          <td class="py-2 px-3 text-center">
            <select onchange="updateStatusQuick('${loc.name}', this.value)" class="text-xs px-2 py-0.5 border rounded bg-white font-bold">
              <option value="In" ${loc.status === 'In' ? 'selected' : ''}>In</option>
              <option value="Working" ${loc.status === 'Working' ? 'selected' : ''}>Working</option>
              <option value="Packing" ${loc.status === 'Packing' ? 'selected' : ''}>Packing</option>
              <option value="Out" ${loc.status === 'Out' ? 'selected' : ''}>Out</option>
            </select>
          </td>
          <td class="py-2 px-3 text-center">
            <button onclick="deleteLocation('${loc.name}')" class="text-gray-400 hover:text-black font-bold text-xs cursor-pointer">ลบ</button>
          </td>
        </tr>
      `).join('');
    }

    function filterLocations() {
      const status = document.getElementById('filter-status').value;
      if(status === 'ALL') renderLocationTable(allLocations);
      else renderLocationTable(allLocations.filter(l => l.status === status));
    }

    async function addSingleLocation() {
      const name = document.getElementById('loc_name').value.trim().toUpperCase();
      const type = document.getElementById('loc_type').value;
      const status = document.getElementById('loc_status').value;
      if(!name) return alert("กรุณาระบุชื่อ Location");

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: 'add_location', name: name, type: type, status: status })
        });
        document.getElementById('loc_name').value = '';
        loadLocations();
      } catch (e) {}
    }

    async function generateRacksBatch() {
      if(!confirm("ยืนยันสร้าง Rack I คลัง BJ ทั้ง 65 ช่อง (BJI01A - BJI05M)?")) return;
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'generate_bji_racks' }) });
        loadLocations();
      } catch (e) {}
    }

    async function updateStatusQuick(locName, newStatus) {
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'update_location_status', name: locName, status: newStatus }) });
        loadLocations();
      } catch (e) {}
    }

    async function deleteLocation(name) {
      if(!confirm(`ต้องการลบ [${name}]?`)) return;
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: 'delete_location', name: name }) });
        loadLocations();
      } catch (e) {}
    }
  </script>
</body>
</html>
