<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - บรรจุสินค้า (Packing)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-blue-200">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar Desktop -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-10 pb-6 px-4 z-40 shadow-sm">
      <h2 class="text-2xl font-bold text-gray-900 mb-10 px-2">BJ Roaster</h2>
      <nav class="flex-1 space-y-2">
        <a href="index.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">หน้าแรก</a>
        <a href="planner.html" class="flex items-center gap-3 bg-blue-50 text-blue-600 px-4 py-3 rounded-xl font-bold transition">ทำงาน</a>
        <a href="report.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">รายงาน</a>
        <a href="stock.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">สต๊อกสินค้า</a>
        <a href="profile.html" class="flex items-center gap-3 text-gray-700 hover:bg-gray-50 px-4 py-3 rounded-xl font-bold transition">โปรไฟล์</a>
      </nav>
      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-500 hover:text-red-500 px-4 py-3 rounded-xl font-bold transition">ออกจากระบบ</button>
    </aside>

    <main class="w-full md:ml-64 relative overflow-hidden flex flex-col min-h-screen">
      
      <!-- 🌟 แถบการ์ด 6 ใบ (บรรจุสินค้า ACTIVE 🌟) -->
      <div class="sticky top-0 z-30 bg-gray-50/95 backdrop-blur-xl pt-6 pb-4 border-b border-gray-200">
        <div class="flex flex-row overflow-x-auto gap-3 px-5 md:px-10 pr-10 snap-x w-full items-center">
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-yellow-50 to-yellow-100 border border-yellow-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='planner.html'"><h2 class="text-base md:text-lg font-bold text-yellow-800 leading-tight">วางแผน<br><span class="text-xs font-medium text-yellow-600">(ออเดอร์)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-orange-50 to-orange-100 border border-orange-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='wip.html'"><h2 class="text-base md:text-lg font-bold text-orange-800 leading-tight">เบิกคั่ว<br><span class="text-xs font-medium text-orange-600">(WIP)</span></h2></div>

          <!-- 3. บรรจุสินค้า (ACTIVE 🌟) -->
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-md bg-gradient-to-br from-purple-500 to-purple-600 border border-purple-600 cursor-default flex flex-col justify-center px-4 transform scale-105">
            <h2 class="text-base md:text-lg font-bold text-white leading-tight">บรรจุสินค้า<br><span class="text-xs font-medium text-purple-100">(Packing)</span></h2>
          </div>

          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-teal-50 to-teal-100 border border-teal-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='shipping.html'"><h2 class="text-base md:text-lg font-bold text-teal-800 leading-tight">จัดส่ง<br><span class="text-xs font-medium text-teal-600">(Shipping)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-indigo-50 to-indigo-100 border border-indigo-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='item_master.html'"><h2 class="text-base md:text-lg font-bold text-indigo-800 leading-tight">เพิ่มข้อมูลใหม่<br><span class="text-xs font-medium text-indigo-600">(สาร, QR, สต๊อก)</span></h2></div>
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-sm bg-gradient-to-br from-green-50 to-green-100 border border-green-200 cursor-pointer flex flex-col justify-center px-4 opacity-70 hover:opacity-100" onclick="window.location.href='inbound.html'"><h2 class="text-base md:text-lg font-bold text-green-800 leading-tight">รับสินค้าเข้า<br><span class="text-xs font-medium text-green-600">(สารกาแฟ)</span></h2></div>
        </div>
      </div>

      <!-- พื้นที่ทำงานบรรจุสินค้า -->
      <div class="p-5 md:p-10 pb-28">
        <div class="max-w-2xl bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
          <div class="border-b border-gray-100 pb-3">
            <h2 class="text-xl font-bold text-gray-800">📦 บันทึกการบรรจุสินค้า (Finished Goods)</h2>
            <p class="text-xs text-gray-500 mt-1">สร้างบาร์โค้ดสินค้าสำเร็จรูปพร้อมจัดส่ง</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">รหัสบาร์โค้ดแพ็คเกจ (Pack Barcode) *</label>
              <input type="text" id="pack_barcode" placeholder="สแกนหรือตั้งรหัส เช่น PK-BRA-250G" class="w-full px-4 py-2.5 border rounded-xl font-bold text-purple-600 uppercase">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">ชื่อสินค้าสำเร็จรูป *</label>
              <input type="text" id="pack_item_name" placeholder="เช่น เมล็ดคั่ว Brazil Cerrado 250g" class="w-full px-4 py-2.5 border rounded-xl">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ขนาดถุงบรรจุ</label>
                <select id="pack_size" class="w-full px-4 py-2.5 border rounded-xl bg-white">
                  <option value="200g">200 กรัม</option>
                  <option value="250g" selected>250 กรัม</option>
                  <option value="500g">500 กรัม</option>
                  <option value="1kg">1 กิโลกรัม</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">จำนวนที่บรรจุได้ (ถุง) *</label>
                <input type="number" id="bag_count" placeholder="เช่น 50" class="w-full px-4 py-2.5 border rounded-xl font-bold text-purple-700">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Batch การคั่ว / Lot</label>
                <input type="text" id="batch_no" placeholder="เช่น BATCH-202609" class="w-full px-4 py-2.5 border rounded-xl uppercase">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">จุดจัดเก็บ (Location)</label>
                <input type="text" id="pack_location" value="PACK-ZONE" class="w-full px-4 py-2.5 border rounded-xl uppercase">
              </div>
            </div>
          </div>

          <button type="button" onclick="savePacking()" id="save-pack-btn" class="w-full mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-95">
            💾 บันทึกรับเข้าสต๊อกสินค้าพร้อมส่ง
          </button>
        </div>
      </div>

    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    async function savePacking() {
      const barcode = document.getElementById('pack_barcode').value.trim();
      const itemName = document.getElementById('pack_item_name').value.trim();
      const size = document.getElementById('pack_size').value;
      const count = document.getElementById('bag_count').value;
      const batch = document.getElementById('batch_no').value.trim();
      const location = document.getElementById('pack_location').value.trim();

      if(!barcode || !itemName || !count) return alert("กรุณากรอกรหัสบาร์โค้ด ชื่อสินค้า และจำนวนถุง");

      const btn = document.getElementById('save-pack-btn');
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: 'pack_product',
            pack_barcode: barcode,
            item_name: itemName,
            pack_size: size,
            bag_count: count,
            batch_no: batch,
            location: location,
            operator: localStorage.getItem('name') || "Packer"
          })
        });
        const result = await res.json();
        alert(result.message);
        if(result.success) {
          document.getElementById('pack_barcode').value = '';
          document.getElementById('pack_item_name').value = '';
          document.getElementById('bag_count').value = '';
          document.getElementById('batch_no').value = '';
        }
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ");
      } finally {
        btn.innerText = "💾 บันทึกรับเข้าสต๊อกสินค้าพร้อมส่ง";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
