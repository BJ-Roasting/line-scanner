<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BJ Roaster - บรรจุสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased selection:bg-gray-200">

  <div class="flex min-h-screen">
    
    <!-- 💻 Sidebar Desktop -->
    <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 h-screen bg-white border-r border-gray-200 pt-7 pb-6 px-4 z-40 shadow-sm no-print">
      <div class="px-2 mb-7">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 bg-black text-white font-black flex items-center justify-center rounded-lg text-sm tracking-tighter">BJ</div>
          <div>
            <h2 class="text-sm font-black text-black tracking-tight leading-none">BJ ROASTER</h2>
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest block mt-0.5">ROASTERY & WMS</span>
          </div>
        </div>
      </div>

      <div class="flex-1 space-y-6 overflow-y-auto">
        <div>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest px-3 mb-2">การปฏิบัติการ</p>
          <nav class="space-y-1">
            <a href="index.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3 py-2 rounded-lg font-bold text-xs transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg> หน้าแรก
            </a>
            <a href="planner.html" class="flex items-center gap-3 bg-black text-white px-3 py-2 rounded-lg font-bold text-xs transition shadow-sm">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.78.929l-.15.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg> ทำงาน
            </a>
            <a href="stock.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3 py-2 rounded-lg font-bold text-xs transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg> สต๊อกสินค้า
            </a>
            <a href="report.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3 py-2 rounded-lg font-bold text-xs transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg> รายงาน
            </a>
          </nav>
        </div>

        <div>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest px-3 mb-2">การจัดการระบบ</p>
          <nav class="space-y-1">
            <a href="profile.html" class="flex items-center gap-3 text-gray-500 hover:text-black hover:bg-gray-100 px-3 py-2 rounded-lg font-bold text-xs transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg> โปรไฟล์
            </a>
          </nav>
        </div>
      </div>

      <div class="pt-4 border-t border-gray-100">
        <button onclick="handleLogout()" class="w-full flex items-center gap-3 text-gray-400 hover:text-black hover:bg-gray-50 px-3 py-2 rounded-lg font-bold text-xs transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg> ออกจากระบบ
        </button>
      </div>
    </aside>

    <main class="w-full md:ml-64 relative flex flex-col min-h-screen">
      
      <!-- 🌟 แถบเมนูด้านบน สไตล์ Binance Tab Header (ขาว-ดำ) 🌟 -->
      <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200">
        <div class="flex items-center gap-2 overflow-x-auto px-4 md:px-8 py-2.5 snap-x">
          <button onclick="window.location.href='planner.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">วางแผน</button>
          <button onclick="window.location.href='wip.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">เบิกคั่ว</button>
          <!-- Active Tab: บรรจุสินค้า -->
          <button class="px-4 py-2 rounded-lg text-sm font-bold bg-black text-white whitespace-nowrap shadow-sm">บรรจุสินค้า</button>
          <button onclick="window.location.href='shipping.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">จัดส่ง</button>
          <button onclick="window.location.href='item_master.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">เพิ่มข้อมูลใหม่</button>
          <button onclick="window.location.href='inbound.html'" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-black hover:bg-gray-100 transition whitespace-nowrap">รับสินค้าเข้า</button>
        </div>
      </div>

      <div class="p-4 md:p-8 pb-28 max-w-2xl space-y-6">
        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
          <div class="border-b border-gray-100 pb-3">
            <h2 class="text-base font-bold text-black">บันทึกการบรรจุสินค้า</h2>
            <p class="text-xs text-gray-400">สร้างบาร์โค้ดสินค้าสำเร็จรูปเพื่อนำเข้าสต๊อกพร้อมจำหน่าย</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">รหัสบาร์โค้ดแพ็คเกจ *</label>
              <input type="text" id="pack_barcode" placeholder="เช่น PK-AD05-250G" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-mono font-bold text-black uppercase text-sm focus:border-black focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">ชื่อสินค้าสำเร็จรูป *</label>
              <input type="text" id="pack_item_name" placeholder="เช่น กาแฟคั่ว ดอยช้าง 250g" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-black focus:border-black focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">ขนาดบรรจุภัณฑ์</label>
                <select id="pack_size" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white text-sm font-medium focus:border-black focus:outline-none">
                  <option value="200g">200 กรัม</option>
                  <option value="250g" selected>250 กรัม</option>
                  <option value="500g">500 กรัม</option>
                  <option value="1kg">1 กิโลกรัม</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">จำนวนที่บรรจุได้ (ถุง) *</label>
                <input type="number" id="bag_count" placeholder="เช่น 50" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-black text-black text-sm focus:border-black focus:outline-none">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Batch การคั่ว / Lot</label>
                <input type="text" id="batch_no" placeholder="BATCH-202609" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs uppercase font-mono">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">จุดจัดเก็บ</label>
                <input type="text" id="pack_location" value="PACK-ZONE" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs uppercase font-mono">
              </div>
            </div>
          </div>

          <button type="button" onclick="savePacking()" id="save-pack-btn" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-lg text-sm transition active:scale-95 cursor-pointer">
            บันทึกรับเข้าสต๊อกสินค้าสำเร็จรูป
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec";

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    async function savePacking() {
      const barcode = document.getElementById('pack_barcode').value.trim();
      const itemName = document.getElementById('pack_item_name').value.trim();
      const size = document.getElementById('pack_size').value;
      const count = document.getElementById('bag_count').value;
      const batch = document.getElementById('batch_no').value.trim();
      const location = document.getElementById('pack_location').value.trim();

      if(!barcode || !itemName || !count) return alert("กรุณากรอกรหัสบาร์โค้ด ชื่อสินค้า และจำนวนถุง");

      const btn = document.getElementById('save-pack-btn');
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: 'pack_product',
            pack_barcode: barcode,
            item_name: itemName,
            pack_size: size,
            bag_count: count,
            batch_no: batch,
            location: location,
            operator: localStorage.getItem('name') || "Packer"
          })
        });
        const result = await res.json();
        alert(result.message);
        if(result.success) {
          document.getElementById('pack_barcode').value = '';
          document.getElementById('pack_item_name').value = '';
          document.getElementById('bag_count').value = '';
          document.getElementById('batch_no').value = '';
        }
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ");
      } finally {
        btn.innerText = "บันทึกรับเข้าสต๊อกสินค้าสำเร็จรูป";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
