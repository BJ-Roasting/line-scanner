<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>พื้นที่ทำงาน - BJ Roaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    /* ซ่อน Scrollbar ของตู้การ์ดแนวนอน */
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

  <!-- ===================================== -->
  <!-- 📌 ส่วนหัว & การ์ดเมนู (Sticky ล็อกติดด้านบน) -->
  <!-- ===================================== -->
  <div class="sticky top-0 bg-gray-50/95 backdrop-blur-xl z-30 pt-5 pb-2 px-5 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900 mb-4">พื้นที่ทำงาน</h1>
    
    <!-- ตู้การ์ดเลื่อนซ้ายขวาได้ (Horizontal Scroll) -->
    <div class="flex gap-4 overflow-x-auto snap-x hide-scroll pb-2">
      
      <!-- การ์ด 1: Inbound (Active เป็นค่าเริ่มต้น) -->
      <div onclick="switchTab('inbound')" id="card-inbound" class="work-card flex-none w-36 p-4 rounded-2xl cursor-pointer snap-start transition shadow-sm border-2 border-blue-500 bg-blue-50 opacity-100">
        <div class="text-2xl mb-1">📥</div>
        <p class="font-bold text-sm text-gray-800">รับสารกาแฟ</p>
        <p class="text-[10px] text-gray-500">Inbound</p>
      </div>

      <!-- การ์ด 2: WIP -->
      <div onclick="switchTab('wip')" id="card-wip" class="work-card flex-none w-36 p-4 rounded-2xl cursor-pointer snap-start transition shadow-sm border-2 border-transparent bg-white opacity-60 hover:opacity-100">
        <div class="text-2xl mb-1">🔥</div>
        <p class="font-bold text-sm text-gray-800">เบิกคั่ว (WIP)</p>
        <p class="text-[10px] text-gray-500">Issue Stock</p>
      </div>

      <!-- การ์ด 3: Planner -->
      <div onclick="switchTab('planner')" id="card-planner" class="work-card flex-none w-36 p-4 rounded-2xl cursor-pointer snap-start transition shadow-sm border-2 border-transparent bg-white opacity-60 hover:opacity-100">
        <div class="text-2xl mb-1">📅</div>
        <p class="font-bold text-sm text-gray-800">แผนการผลิต</p>
        <p class="text-[10px] text-gray-500">Planner</p>
      </div>

    </div>
  </div>

  <!-- ===================================== -->
  <!-- 📄 พื้นที่เนื้อหา (Content Area) -->
  <!-- ===================================== -->
  <div class="p-5 pb-28">
    
    <!-- เนื้อหา 1: ฟอร์มรับของเข้า (Inbound) -->
    <div id="content-inbound" class="work-content block animate-[fadeIn_0.3s_ease-in-out]">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-blue-700 mb-4 border-b pb-2">📥 ฟอร์มรับสารกาแฟเข้าสต๊อก</h2>
        <!-- 💡 คุณสามารถนำโค้ดฟอร์มจากไฟล์ inbound.html เดิม มาวางแทนที่ตรงนี้ได้เลยครับ -->
        <div class="space-y-4">
          <input type="text" placeholder="รหัสบาร์โค้ด *" class="w-full px-4 py-3 bg-gray-50 border rounded-xl">
          <input type="text" placeholder="รายการสินค้า *" class="w-full px-4 py-3 bg-gray-50 border rounded-xl">
          <input type="number" placeholder="น้ำหนักสุทธิ (kg) *" class="w-full px-4 py-3 bg-gray-50 border rounded-xl">
          <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">บันทึกรับเข้า</button>
        </div>
      </div>
    </div>

    <!-- เนื้อหา 2: ฟอร์มเบิกของไปคั่ว (WIP) -->
    <div id="content-wip" class="work-content hidden animate-[fadeIn_0.3s_ease-in-out]">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-amber-600 mb-4 border-b pb-2">🔥 ฟอร์มสแกนเบิกสารกาแฟ</h2>
        <!-- 💡 คุณสามารถนำโค้ดฟอร์มจากไฟล์ wip.html เดิม มาวางแทนที่ตรงนี้ได้เลยครับ -->
        <div class="space-y-4">
          <input type="text" placeholder="สแกนรหัสบาร์โค้ดที่นี่" class="w-full px-4 py-3 bg-gray-50 border rounded-xl font-bold text-center">
          <input type="number" placeholder="น้ำหนักที่เบิก (kg)" class="w-full px-4 py-3 bg-gray-50 border rounded-xl font-bold text-center text-amber-700">
          <button class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl">ตัดสต๊อกเบิกของ</button>
        </div>
      </div>
    </div>

    <!-- เนื้อหา 3: วางแผนการผลิต (Planner) -->
    <div id="content-planner" class="work-content hidden animate-[fadeIn_0.3s_ease-in-out]">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-yellow-600 mb-4 border-b pb-2">📅 จัดการออเดอร์คั่ว</h2>
        <div class="text-center text-gray-500 py-10">
          <p class="text-4xl mb-2">🚧</p>
          <p>พื้นที่สำหรับวางระบบ Planner<br>(นำโค้ดตารางมาวางตรงนี้)</p>
        </div>
      </div>
    </div>

  </div>

  <!-- 📱 Bottom Navigation -->
  <div id="bottom-nav" class="fixed bottom-0 w-full bg-white/95 backdrop-blur-xl border-t border-gray-200 pb-safe z-40 md:hidden shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)]">
    <div class="flex justify-around items-center pt-3 pb-2 px-1">
      <div onclick="window.location.href='index.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg><span class="text-[10px] font-medium">หน้าแรก</span>
      </div>
      <div class="flex flex-col items-center justify-center w-[20%] text-blue-600 cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg><span class="text-[10px] font-bold">ทำงาน</span>
      </div>
      <div onclick="alert('ระบบรายงานกำลังพัฒนาครับ 📊')" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg><span class="text-[10px] font-medium">รายงาน</span>
      </div>
      <div onclick="window.location.href='inventory.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg><span class="text-[10px] font-medium">สต๊อก</span>
      </div>
      <div onclick="window.location.href='item_master.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg><span class="text-[10px] font-medium">โปรไฟล์</span>
      </div>
    </div>
  </div>

  <script>
    // ฟังก์ชันสำหรับสลับแท็บเมนู
    function switchTab(tabId) {
      // 1. ซ่อนเนื้อหาทั้งหมดก่อน
      document.querySelectorAll('.work-content').forEach(el => {
        el.classList.remove('block');
        el.classList.add('hidden');
      });

      // 2. ล้างรูปแบบ Active ออกจากการ์ดทุกใบ
      document.querySelectorAll('.work-card').forEach(el => {
        el.classList.remove('border-blue-500', 'bg-blue-50', 'opacity-100');
        el.classList.add('border-transparent', 'bg-white', 'opacity-60');
      });

      // 3. โชว์เนื้อหาที่เลือก
      document.getElementById('content-' + tabId).classList.remove('hidden');
      document.getElementById('content-' + tabId).classList.add('block');

      // 4. ไฮไลต์การ์ดที่ถูกกด
      const activeCard = document.getElementById('card-' + tabId);
      activeCard.classList.remove('border-transparent', 'bg-white', 'opacity-60');
      activeCard.classList.add('border-blue-500', 'bg-blue-50', 'opacity-100');
    }
  </script>
</body>
</html>
