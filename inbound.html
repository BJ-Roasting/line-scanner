<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รับสารกาแฟเข้า (Inbound)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-4">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">📥 รับสารกาแฟเข้าสต๊อก</h1>
    
    <div class="space-y-4">
      <!-- รหัสบาร์โค้ด -->
      <div>
        <label class="block text-sm font-medium text-gray-700">รหัสบาร์โค้ด (Barcode ID)</label>
        <div class="flex gap-2 mt-1">
          <input type="text" id="barcode_id" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500" placeholder="สแกนหรือพิมพ์รหัส">
        </div>
      </div>

      <!-- ชื่อสารกาแฟ -->
      <div>
        <label class="block text-sm font-medium text-gray-700">ชื่อสารกาแฟ (Item Name)</label>
        <input type="text" id="item_name" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 mt-1" placeholder="เช่น Brazil Santos">
      </div>

      <!-- น้ำหนักรับเข้า -->
      <div class="flex gap-4">
        <div class="w-2/3">
          <label class="block text-sm font-medium text-gray-700">น้ำหนัก (กิโลกรัม)</label>
          <input type="number" id="weight" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 mt-1" placeholder="0.00" step="0.01">
        </div>
        <div class="w-1/3">
          <label class="block text-sm font-medium text-gray-700">หน่วย</label>
          <input type="text" id="unit" value="kg" class="w-full px-4 py-2 border rounded-lg bg-gray-100 mt-1" readonly>
        </div>
      </div>

      <!-- จุดจัดเก็บ & ซัพพลายเออร์ -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">จุดจัดเก็บ (Location)</label>
          <input type="text" id="location" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 mt-1" placeholder="เช่น Rack A">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">แหล่งปลูก (Supplier)</label>
          <input type="text" id="supplier" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 mt-1" placeholder="ชื่อ Supplier">
        </div>
      </div>

      <!-- หมายเหตุ -->
      <div>
        <label class="block text-sm font-medium text-gray-700">หมายเหตุ (Description)</label>
        <textarea id="description" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 mt-1" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
      </div>

      <!-- แจ้งเตือน & ปุ่มบันทึก -->
      <p id="status-msg" class="text-sm text-center hidden font-bold"></p>
      
      <button onclick="saveInbound()" id="save-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 shadow-lg text-lg">
        บันทึกรับเข้าสต๊อก
      </button>
      
      <!-- ปุ่มกลับหน้าหลัก -->
      <button onclick="window.location.href='index.html'" class="w-full bg-gray-200 text-gray-700 font-bold py-2 rounded-lg mt-2">
        กลับหน้าหลัก
      </button>
    </div>
  </div>

  <script>
    // ⚠️ นำ URL Web App ของคุณมาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    async function saveInbound() {
      const barcode = document.getElementById('barcode_id').value;
      const itemName = document.getElementById('item_name').value;
      const weight = document.getElementById('weight').value;
      const location = document.getElementById('location').value;
      
      const btn = document.getElementById('save-btn');
      const msg = document.getElementById('status-msg');

      if(!barcode || !itemName || !weight || !location) {
        msg.textContent = "กรุณากรอกข้อมูลสำคัญให้ครบ (บาร์โค้ด, ชื่อ, น้ำหนัก, จุดเก็บ)";
        msg.className = "text-sm text-center text-red-500 font-bold block";
        return;
      }

      btn.innerText = "กำลังบันทึกข้อมูล...";
      btn.disabled = true;
      msg.classList.add('hidden');

      const payload = {
        action: 'inbound',
        barcode_id: barcode,
        item_name: itemName,
        weight: parseFloat(weight),
        location: location,
        supplier: document.getElementById('supplier').value,
        description: document.getElementById('description').value
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        
        const result = await response.json();

        if(result.success) {
          msg.textContent = result.message;
          msg.className = "text-sm text-center text-green-600 font-bold block";
          // ล้างฟอร์มเพื่อสแกนใบต่อไป
          document.querySelectorAll('input[type="text"]:not(#unit), input[type="number"], textarea').forEach(el => el.value = '');
          document.getElementById('barcode_id').focus();
        } else {
          msg.textContent = result.message || "เกิดข้อผิดพลาด";
          msg.className = "text-sm text-center text-red-500 font-bold block";
        }
      } catch (error) {
        msg.textContent = "เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่";
        msg.className = "text-sm text-center text-red-500 font-bold block";
      }
      
      btn.innerText = "บันทึกรับเข้าสต๊อก";
      btn.disabled = false;
    }
  </script>
</body>
</html>
