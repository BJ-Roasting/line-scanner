<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รับสารกาแฟเข้า (Inbound)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-4">📥 รับสารกาแฟเข้าสต๊อก</h1>
    
    <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-sm text-amber-800 mb-6">
      <span class="font-bold">ผู้ทำรายการ:</span> <span id="operator-name">กำลังโหลด...</span>
    </div>

    <div class="space-y-6">
      
      <!-- หมวด 1: ข้อมูลใบงาน (Workorder) -->
      <div class="p-4 border rounded-lg bg-gray-50">
        <h2 class="font-bold text-gray-700 mb-3 border-b pb-2">📄 ข้อมูลใบงาน (Workorder)</h2>
        <div class="grid grid-cols-2 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-gray-600">รหัส Workorder</label>
            <input type="text" id="wo_number" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1" placeholder="ระบุรหัส WO">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">ประเภทใบงาน</label>
            <input type="text" id="wo_type" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">จำนวนใบงาน</label>
            <input type="number" id="wo_count" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
        </div>
      </div>

      <!-- หมวด 2: ข้อมูลสินค้า -->
      <div class="p-4 border rounded-lg bg-gray-50">
        <h2 class="font-bold text-gray-700 mb-3 border-b pb-2">📦 ข้อมูลสินค้า</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-600">รหัสบาร์โค้ด (Barcode ID) *</label>
            <input type="text" id="barcode_id" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1" placeholder="สแกนบาร์โค้ด">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">รายการสินค้า (Item Name) *</label>
            <input type="text" id="item_name" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600">ผู้จัดจำหน่าย (Supplier)</label>
              <input type="text" id="supplier" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">Lot Code (สร้างเอง)</label>
              <input type="text" id="lot_code" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
            </div>
          </div>
        </div>
      </div>

      <!-- หมวด 3: ปริมาณและน้ำหนัก -->
      <div class="p-4 border rounded-lg bg-gray-50">
        <h2 class="font-bold text-gray-700 mb-3 border-b pb-2">⚖️ ปริมาณและพื้นที่จัดเก็บ</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600">จำนวนพาเลท</label>
            <input type="number" id="pallet_count" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">กิโล/กระสอบ</label>
            <input type="number" id="kg_per_sack" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1" step="0.01">
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-medium text-gray-600">น้ำหนักรวมสุทธิ (kg) *</label>
            <input type="number" id="weight" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1 font-bold text-green-700" placeholder="0.00">
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-medium text-gray-600">จุดจัดเก็บ (Location) *</label>
            <input type="text" id="location" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
        </div>
      </div>

      <!-- หมวด 4: QC โปรไฟล์ (Moisture & Density) -->
      <div class="p-4 border rounded-lg bg-blue-50 border-blue-200">
        <h2 class="font-bold text-blue-800 mb-3 border-b border-blue-200 pb-2">🔬 โปรไฟล์ QC สารกาแฟ</h2>
        <div class="grid grid-cols-3 gap-2 text-center items-center">
          <div class="text-xs font-bold text-gray-600">ครั้งที่</div>
          <div class="text-xs font-bold text-gray-600">ความชื้น (%)</div>
          <div class="text-xs font-bold text-gray-600">Density</div>
          
          <div class="text-sm font-medium">สุ่มที่ 1</div>
          <input type="number" id="moisture1" class="w-full px-2 py-1 border rounded" step="0.01">
          <input type="number" id="density1" class="w-full px-2 py-1 border rounded" step="0.01">

          <div class="text-sm font-medium">สุ่มที่ 2</div>
          <input type="number" id="moisture2" class="w-full px-2 py-1 border rounded" step="0.01">
          <input type="number" id="density2" class="w-full px-2 py-1 border rounded" step="0.01">

          <div class="text-sm font-medium">สุ่มที่ 3</div>
          <input type="number" id="moisture3" class="w-full px-2 py-1 border rounded" step="0.01">
          <input type="number" id="density3" class="w-full px-2 py-1 border rounded" step="0.01">
        </div>
      </div>

      <!-- หมวด 5: อื่นๆ -->
      <div class="p-4 border rounded-lg bg-gray-50">
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-medium text-gray-600">ผู้ช่วย 1</label>
            <input type="text" id="assistant1" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">ผู้ช่วย 2</label>
            <input type="text" id="assistant2" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600">Description (หมายเหตุ)</label>
          <textarea id="description" rows="2" class="w-full px-3 py-2 border rounded focus:ring-green-500 mt-1"></textarea>
        </div>
      </div>

      <!-- ปุ่มบันทึก -->
      <p id="status-msg" class="text-sm text-center hidden font-bold"></p>
      <button onclick="saveInbound()" id="save-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 shadow-lg text-lg">
        💾 บันทึกรับเข้าสต๊อก
      </button>
      <button onclick="window.location.href='index.html'" class="w-full bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">
        กลับหน้าหลัก
      </button>

    </div>
  </div>

  <script>
    // ⚠️ นำ URL Web App ของคุณมาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbxQywqP4da0BYdt_dHQtQl-kYlvGxmdJWNA59oqnZ_AM7SRyEESbMd73UD3Xx6VffQ/exec"; 

    let operatorName = localStorage.getItem('name') || "ไม่ระบุชื่อ";
    document.getElementById('operator-name').innerText = operatorName;

    async function saveInbound() {
      // ดึงค่าบังคับ
      const barcode = document.getElementById('barcode_id').value;
      const itemName = document.getElementById('item_name').value;
      const weight = document.getElementById('weight').value;
      const location = document.getElementById('location').value;
      
      const btn = document.getElementById('save-btn');
      const msg = document.getElementById('status-msg');

      if(!barcode || !itemName || !weight || !location) {
        msg.textContent = "กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน";
        msg.className = "text-sm text-center text-red-500 font-bold block mt-2";
        return;
      }

      btn.innerText = "กำลังบันทึกข้อมูล...";
      btn.disabled = true;
      msg.classList.add('hidden');

      // รวบรวมข้อมูลทั้งหมด
      const payload = {
        action: 'inbound',
        barcode_id: barcode,
        item_name: itemName,
        weight: parseFloat(weight),
        location: location,
        wo_number: document.getElementById('wo_number').value,
        wo_type: document.getElementById('wo_type').value,
        wo_count: document.getElementById('wo_count').value,
        supplier: document.getElementById('supplier').value,
        lot_code: document.getElementById('lot_code').value,
        pallet_count: document.getElementById('pallet_count').value,
        kg_per_sack: document.getElementById('kg_per_sack').value,
        moisture1: document.getElementById('moisture1').value,
        density1: document.getElementById('density1').value,
        moisture2: document.getElementById('moisture2').value,
        density2: document.getElementById('density2').value,
        moisture3: document.getElementById('moisture3').value,
        density3: document.getElementById('density3').value,
        operator: operatorName,
        assistant1: document.getElementById('assistant1').value,
        assistant2: document.getElementById('assistant2').value,
        description: document.getElementById('description').value
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        
        const result = await response.json();

        if(result.success) {
          msg.textContent = result.message;
          msg.className = "text-sm text-center text-green-600 font-bold block mt-2";
          // ล้างฟอร์ม
          document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => el.value = '');
          window.scrollTo(0, 0);
          document.getElementById('wo_number').focus();
        } else {
          msg.textContent = result.message || "เกิดข้อผิดพลาด";
          msg.className = "text-sm text-center text-red-500 font-bold block mt-2";
        }
      } catch (error) {
        msg.textContent = "เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่";
        msg.className = "text-sm text-center text-red-500 font-bold block mt-2";
      }
      
      btn.innerText = "💾 บันทึกรับเข้าสต๊อก";
      btn.disabled = false;
    }
  </script>
</body>
</html>
