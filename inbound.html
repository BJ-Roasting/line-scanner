<!DOCTYPE html>

        <div class="flex flex-row overflow-x-auto gap-3 px-5 md:px-10 pr-10 snap-x w-full items-center">
          
          <!-- 1. รับสินค้าเข้า (ACTIVE 🌟) -->
          <div class="relative flex-none w-40 h-24 md:w-48 md:h-28 rounded-2xl overflow-hidden shadow-md bg-gradient-to-br from-green-400 to-green-500 border border-green-500 cursor-default flex flex-col justify-center px-4 transform scale-105" onclick="window.location.href='inbound.html'">
            <h2 class="text-base md:text-lg font-bold text-white leading-tight">รับสินค้าเข้า<br><span class="text-xs font-medium text-green-100">(สารกาแฟ)</span></h2>

        </div>

    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }
