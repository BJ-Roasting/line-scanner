        <a href="profile.html" class="flex items-center gap-3 bg-blue-50 text-blue-600 px-4 py-3 rounded-xl font-bold transition">

      <button onclick="handleLogout()" class="mt-8 flex items-center gap-3 text-gray-500 hover:text-red-500 px-4 py-3 rounded-xl font-bold transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg> ออกจากระบบ</button>

    <main class="w-full md:ml-64 relative overflow-hidden flex flex-col min-h-screen">
      <div class="p-5 md:p-10 pb-28 flex flex-col items-center">
        <div class="w-full max-w-md">
          <div class="flex flex-col items-center text-center bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center border border-blue-200 shadow-sm mb-4">
              <span id="profile-initial" class="text-2xl font-bold text-blue-700">--</span>
            </div>
            <h2 id="profile-name" class="text-xl font-bold text-gray-900">...</h2>
            <p id="profile-role" class="text-sm text-gray-500 mt-1 bg-gray-100 px-3 py-1 rounded-full inline-block">...</p>
          </div>

          <div class="bg-white mt-4 rounded-2xl border border-gray-200 shadow-sm divide-y divide-gray-100">
            <div class="p-4 flex justify-between items-center">
              <span class="text-sm font-bold text-gray-500">ชื่อผู้ใช้งาน</span>
              <span id="profile-detail-name" class="font-bold text-gray-800">-</span>
            </div>
            <div class="p-4 flex justify-between items-center">
              <span class="text-sm font-bold text-gray-500">ตำแหน่ง/สิทธิ์</span>
              <span id="profile-detail-role" class="font-bold text-gray-800">-</span>
            </div>
          </div>

          <button onclick="handleLogout()" class="w-full mt-6 bg-red-50 text-red-500 font-bold py-3 rounded-xl hover:bg-red-100 transition">🚪 ออกจากระบบ</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 📱 Bottom Navigation (มือถือ) -->

    <div class="flex justify-around items-center pt-3 pb-2 px-1">

      <div onclick="window.location.href='report.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer"><svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg><span class="text-[10px] font-medium">รายงาน</span></div>
      <div onclick="window.location.href='stock.html'" class="flex flex-col items-center justify-center w-[20%] text-gray-400 hover:text-gray-800 cursor-pointer"><svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg><span class="text-[10px] font-medium">สต๊อกสินค้า</span></div>

  <script>
    function handleLogout() {
      if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
        localStorage.clear();
        window.location.href='index.html';
      }
    }

    (function() {
      const name = localStorage.getItem('name') || 'ไม่ระบุชื่อ';
      const role = localStorage.getItem('role') || 'พนักงาน';
      document.getElementById('profile-initial').innerText = name.substring(0, 2).toUpperCase();
      document.getElementById('profile-name').innerText = name;
      document.getElementById('profile-role').innerText = role;
      document.getElementById('profile-detail-name').innerText = name;
      document.getElementById('profile-detail-role').innerText = role;
    })();

  </script>

</html>
